name: CI

on:
  pull_request:
  workflow_call:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:db:embedded
      - run: npm audit --audit-level=high
      - run: npm run build
        env:
          VITE_DEMO_MODE: true
